!
frr version 10.2.1_git
frr defaults datacenter
hostname leaf3
domainname localdomain
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description to spine1 eth3
 ip address 10.1.1.5/31
 ip pim
exit
!
interface eth2
 description to spine2 eth3
 ip address 10.1.2.5/31
 ip pim
exit
!
interface lo
 ip address 10.0.0.13/32
 ip pim
exit
!
interface vlan10
 description SVI VLAN 10 (gateway for hosts)
 ip address 10.10.3.1/24
 ip igmp
 ip pim
exit
!
interface vlan20
 description SVI VLAN 20 (gateway for hosts)
 ip address 10.20.3.1/24
 ip igmp
 ip pim
exit
!
router bgp 65103
 bgp router-id 10.0.0.13
 bgp bestpath as-path multipath-relax
 neighbor SPINES peer-group
 neighbor SPINES remote-as 65000
 neighbor 10.1.1.4 peer-group SPINES
 neighbor 10.1.1.4 description spine1
 neighbor 10.1.2.4 peer-group SPINES
 neighbor 10.1.2.4 description spine2
 !
 address-family ipv4 unicast
  network 10.0.0.13/32
  network 10.10.3.0/24
  network 10.20.3.0/24
  maximum-paths 8
 exit-address-family
exit
!
router pim
 rp 10.0.0.1 239.0.0.0/8
exit
!
end
