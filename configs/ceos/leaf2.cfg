! leaf2 - Arista cEOS startup configuration (topologies/dc-ceos.clab.yml)
! Role: L3 leaf. Ethernet1/2 routed uplinks to the FRR spines (eBGP, PIM),
! Ethernet3/4 access ports for the hosts in VLAN 10 / VLAN 20, SVIs Vlan10 and
! Vlan20 as the hosts' default gateways (inter-VLAN routing), IGMP snooping in
! both VLANs, IGMP + PIM sparse-mode on the SVIs.
!
service routing protocols model multi-agent
!
hostname leaf2
!
no aaa root
username admin privilege 15 role network-admin secret admin
!
spanning-tree mode mstp
!
vlan 10
   name HOSTS-A
!
vlan 20
   name HOSTS-B
!
interface Ethernet1
   description to spine1 eth2
   no switchport
   ip address 10.1.1.3/31
   pim ipv4 sparse-mode
!
interface Ethernet2
   description to spine2 eth2
   no switchport
   ip address 10.1.2.3/31
   pim ipv4 sparse-mode
!
interface Ethernet3
   description host h21 (VLAN 10)
   switchport access vlan 10
   spanning-tree portfast
!
interface Ethernet4
   description host h22 (VLAN 20)
   switchport access vlan 20
   spanning-tree portfast
!
interface Loopback0
   ip address 10.0.0.12/32
!
interface Management0
   ip address 172.40.40.22/24
!
interface Vlan10
   description SVI VLAN 10 (gateway for hosts)
   ip address 10.10.2.1/24
   ip igmp
   pim ipv4 sparse-mode
!
interface Vlan20
   description SVI VLAN 20 (gateway for hosts)
   ip address 10.20.2.1/24
   ip igmp
   pim ipv4 sparse-mode
!
ip routing
!
ip igmp snooping
ip igmp snooping vlan 10
ip igmp snooping vlan 20
!
router bgp 65102
   router-id 10.0.0.12
   maximum-paths 4 ecmp 4
   neighbor SPINES peer group
   neighbor SPINES remote-as 65000
   neighbor 10.1.1.2 peer group SPINES
   neighbor 10.1.1.2 description spine1
   neighbor 10.1.2.2 peer group SPINES
   neighbor 10.1.2.2 description spine2
   network 10.0.0.12/32
   network 10.10.2.0/24
   network 10.20.2.0/24
!
router multicast
   ipv4
      routing
!
router pim sparse-mode
   ipv4
      rp address 10.0.0.1 239.0.0.0/8
!
management api http-commands
   no shutdown
!
management ssh
   idle-timeout 0
!
end
