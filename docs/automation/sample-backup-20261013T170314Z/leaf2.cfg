!
frr version 10.2.1_git
frr defaults datacenter
hostname leaf2
domainname localdomain
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description to spine1 eth2
 ip address 10.1.1.3/31
 ip pim
exit
!
interface eth2
 description to spine2 eth2
 ip address 10.1.2.3/31
 ip pim
exit
!
interface lo
 ip address 10.0.0.12/32
 ip pim
exit
!
interface vlan10
 description SVI VLAN 10 (gateway for hosts)
 ip address 10.10.2.1/24
 ip igmp
 ip pim
exit
!
interface vlan20
 description SVI VLAN 20 (gateway for hosts)
 ip address 10.20.2.1/24
 ip igmp
 ip pim
exit
!
router bgp 65102
 bgp router-id 10.0.0.12
 bgp bestpath as-path multipath-relax
 neighbor SPINES peer-group
 neighbor SPINES remote-as 65000
 neighbor 10.1.1.2 peer-group SPINES
 neighbor 10.1.1.2 description spine1
 neighbor 10.1.2.2 peer-group SPINES
 neighbor 10.1.2.2 description spine2
 !
 address-family ipv4 unicast
  network 10.0.0.12/32
  network 10.10.2.0/24
  network 10.20.2.0/24
  maximum-paths 8
 exit-address-family
exit
!
router pim
 rp 10.0.0.1 239.0.0.0/8
exit
!
end
