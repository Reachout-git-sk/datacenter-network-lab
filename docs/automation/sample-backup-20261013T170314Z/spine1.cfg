!
frr version 10.2.1_git
frr defaults datacenter
hostname spine1
domainname localdomain
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description to leaf1 eth1
 ip address 10.1.1.0/31
 ip pim
exit
!
interface eth2
 description to leaf2 eth1
 ip address 10.1.1.2/31
 ip pim
exit
!
interface eth3
 description to leaf3 eth1
 ip address 10.1.1.4/31
 ip pim
exit
!
interface lo
 ip address 10.0.0.1/32
 ip pim
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 bgp bestpath as-path multipath-relax
 neighbor 10.1.1.1 remote-as 65101
 neighbor 10.1.1.1 description leaf1
 neighbor 10.1.1.3 remote-as 65102
 neighbor 10.1.1.3 description leaf2
 neighbor 10.1.1.5 remote-as 65103
 neighbor 10.1.1.5 description leaf3
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  maximum-paths 8
 exit-address-family
exit
!
router pim
 rp 10.0.0.1 239.0.0.0/8
exit
!
end
