frr version 10.2.1
frr defaults datacenter
hostname leaf1
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.11/32
 ip pim
exit
!
interface eth1
 description to spine1 eth1
 ip address 10.1.1.1/31
 ip pim
exit
!
interface eth2
 description to spine2 eth1
 ip address 10.1.2.1/31
 ip pim
exit
!
interface vlan10
 description SVI VLAN 10 (gateway for hosts)
 ip address 10.10.1.1/24
 ip pim
 ip igmp
 ip igmp version 3
exit
!
interface vlan20
 description SVI VLAN 20 (gateway for hosts)
 ip address 10.20.1.1/24
 ip pim
 ip igmp
 ip igmp version 3
exit
!
router bgp 65101
 bgp router-id 10.0.0.11
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor SPINES peer-group
 neighbor SPINES remote-as 65000
 neighbor 10.1.1.0 peer-group SPINES
 neighbor 10.1.1.0 description spine1
 neighbor 10.1.2.0 peer-group SPINES
 neighbor 10.1.2.0 description spine2
 !
 address-family ipv4 unicast
  network 10.0.0.11/32
  network 10.10.1.0/24
  network 10.20.1.0/24
  maximum-paths 8
 exit-address-family
exit
!
router pim
 rp 10.0.0.1 239.0.0.0/8
exit
!
